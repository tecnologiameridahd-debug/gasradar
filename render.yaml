# Despliegue en Render.com
# New → Blueprint → este repo
# La base Postgres se crea y se enlaza a DATABASE_URL (stats e IPs no se borran).

databases:
  - name: gasradar-db
    plan: free
    databaseName: gasradar
    user: gasradar

services:
  - type: web
    name: gasradar
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: gasradar-db
          property: connectionString
      - key: STATS_KEY
        sync: false
      - key: ALERTS_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ZYLA_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
